# Publishes the Obsidian plugin as a GitHub release so BRAT can install and update it.
# To release: bump "version" in package.json, run `npm run build`, commit, then
#   git tag <version> && git push origin <version>      (bare version, e.g. 0.1.2 - no "v")
name: Release Obsidian plugin

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: node test/unit.mjs
      - name: Check the tag matches the plugin version
        run: |
          version=$(node -p "require('./dist/owlbear-bestiary-bridge/manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version"; exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $flags \
            --title "$GITHUB_REF_NAME" \
            --notes "Owlbear Bestiary Bridge $GITHUB_REF_NAME. Install or update with BRAT: Gizmo73/owlbear-obsidian-bestiary" \
            dist/owlbear-bestiary-bridge/main.js \
            dist/owlbear-bestiary-bridge/manifest.json
