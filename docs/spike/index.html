<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obsidian Bridge Test</title>
<style>
  :root { color-scheme: light dark; --bg: #1e1e24; --fg: #e8e6e3; --muted: #9a98a0; --ok: #4caf7a; --fail: #e06c6c; --pending: #d9b84a; --line: #33323a; }
  @media (prefers-color-scheme: light) { :root { --bg: #fbfaf8; --fg: #222; --muted: #666; --line: #ddd; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  #variant { color: var(--muted); font-size: 11px; margin-bottom: 10px; word-break: break-all; }
  .row { display: grid; grid-template-columns: 18px 1fr; gap: 0 6px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .row .icon { grid-row: span 2; font-weight: 700; }
  .row .label { font-weight: 600; }
  .row .detail { color: var(--muted); font-size: 12px; word-break: break-word; }
  .ok .icon { color: var(--ok); } .fail .icon { color: var(--fail); } .pending .icon { color: var(--pending); }
  button { margin: 10px 0; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  details { margin-top: 6px; }
  textarea, pre { width: 100%; font: 11px/1.35 ui-monospace, monospace; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
  textarea { height: 110px; resize: vertical; }
  pre { max-height: 160px; overflow: auto; white-space: pre-wrap; margin: 6px 0 0; }
</style>
</head>
<body>
  <h1>Obsidian bridge test</h1>
  <div id="variant"></div>
  <div id="rows"></div>
  <button id="retry">Retry A &amp; B</button> <button id="link">Try C: obsidian:// link</button>
  <details open>
    <summary>Results to send back (copy or screenshot)</summary>
    <textarea id="summary" readonly></textarea>
  </details>
  <details>
    <summary>Log</summary>
    <pre id="log"></pre>
  </details>
  <script src="app.js"></script>
</body>
</html>
